<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#24483f"><title>申论拾记 · 2027</title><style>
:root{--bg:#f5f3eb;--paper:#fffef9;--ink:#243c35;--muted:#738078;--line:#dce0d5;--accent:#b25237;--green:#234a3f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 'Microsoft YaHei',sans-serif}button,input,select,textarea{font:inherit}button,a,input,select{touch-action:manipulation}button{cursor:pointer;color:inherit}button:focus-visible,a:focus-visible{outline:3px solid #bd8c51;outline-offset:3px}button{border:1px solid var(--line);background:var(--paper);border-radius:7px;padding:9px 16px}button:hover{border-color:var(--green);background:#edf1e9}button.active,.primary{background:var(--green);color:white;border-color:var(--green)}button.small{padding:5px 11px;font-size:12px}h1,h2,h3,.serif{font-family:'STSong','SimSun',serif}h1{font-size:46px;line-height:1.3;margin:18px 0}h2{font-size:26px}h3{font-size:20px;margin:10px 0}p{margin:12px 0}a{color:var(--green)}.layout{display:grid;grid-template-columns:235px 1fr;min-height:100vh}aside{background:#e9ede3;padding:35px 22px;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column}.logo{font-size:26px;font-weight:bold;letter-spacing:3px}.seal{display:inline-grid;place-items:center;background:var(--accent);color:#fff;width:31px;height:35px;margin-right:9px;font:22px 'SimSun'}.sub{font-size:11px;color:var(--muted);letter-spacing:2px;margin:9px 0 35px}nav{display:grid;gap:8px}nav button{text-align:left;border:0;background:transparent;padding:12px 16px}nav button span{margin-right:13px;color:#879488}.asidefoot{margin-top:auto;font-size:12px;color:var(--muted)}main{padding:25px 48px 60px;max-width:1500px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;padding-bottom:20px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}.top strong{color:var(--ink)}.hero{display:grid;grid-template-columns:1fr 260px;gap:40px;align-items:center;padding:25px 0 40px}.eyebrow{color:var(--accent);letter-spacing:3px;font-size:12px}.hero p{color:var(--muted);max-width:620px}.hero-note{border-left:1px solid #c7cdbf;padding:15px 0 15px 32px;line-height:2.2}.hero-note strong{display:block;font:28px/1.7 'SimSun'}.hero-note small{color:var(--muted)}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:22px}.stats{display:grid;grid-template-columns:repeat(4,1fr);border-block:1px solid var(--line);margin-bottom:35px}.stat{padding:20px;border-right:1px solid var(--line)}.stat:last-child{border:0}.stat b{font:32px Georgia;display:block}.stat span{font-size:12px;color:var(--muted)}.heading{display:flex;align-items:center;justify-content:space-between;gap:20px;margin:26px 0 15px}.heading h2{margin:0}.heading small,.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}.card{background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:23px;display:flex;flex-direction:column;min-width:0}.card p{font-size:14px;color:#657469}.card .actions{margin-top:auto;padding-top:17px}.meta{display:flex;justify-content:space-between;gap:10px;font-size:11px;color:var(--muted)}.tag{color:var(--accent);font-size:12px}.num{font:italic 28px Georgia;color:#b7c2b1}.theme{border:0;border-bottom:1px solid var(--line);background:none;border-radius:0;text-align:left;padding:17px 2px;display:flex;align-items:center;gap:18px}.theme strong{font:20px 'SimSun';display:block}.theme small{color:var(--muted)}.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:0 30px}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:25px 0 20px}.toolbar input{flex:1;min-width:200px}.toolbar input,.toolbar select,textarea{background:var(--paper);border:1px solid var(--line);padding:11px 14px;border-radius:7px;color:var(--ink)}.hint{font-size:12px;color:var(--muted);padding:14px 0}.pagination{display:flex;align-items:center;justify-content:center;gap:20px;margin:30px 0}.empty{padding:60px 20px;text-align:center;color:var(--muted)}.reader{max-width:850px;margin:25px auto;background:var(--paper);padding:36px;border:1px solid var(--line);border-radius:10px}.reading{font:19px/2.05 'SimSun',serif;white-space:pre-wrap;overflow-wrap:anywhere}.answer{padding:24px;background:#f2f4ed;border-left:3px solid var(--green);margin:25px 0}.hiddenanswer{padding:45px 20px;border:1px dashed #b6c2b4;text-align:center;color:var(--muted);margin:25px 0}.cue{font-size:17px;line-height:2;color:var(--green)}textarea{display:block;width:100%;min-height:130px;resize:vertical}.progress{height:5px;background:#dfe5da;margin:16px 0}.progress i{height:100%;display:block;background:var(--green)}dialog{width:min(900px,94vw);max-height:90vh;border:1px solid var(--line);border-radius:10px;padding:0;background:var(--paper);color:var(--ink)}dialog::backdrop{background:#172e2b99}.modalhead{position:sticky;top:0;background:var(--paper);padding:15px 25px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:20px;z-index:2}.modalbody{padding:25px 35px}.modalbody h2{margin-top:0}.source{font-size:12px;color:var(--muted);margin-top:20px}.note{background:#edf0e7;padding:18px;border-radius:7px;margin:20px 0}.listrow{border-bottom:1px solid var(--line);padding:20px 0;display:flex;justify-content:space-between;gap:25px;align-items:center}.listrow h3{margin:0}.sectionintro{max-width:800px;color:var(--muted)}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:10px 22px;border-radius:8px;z-index:10}.dark{--bg:#182822;--paper:#21352d;--ink:#e3e8dc;--muted:#adbbad;--line:#3f5147;--green:#567e61}.dark aside{background:#1f3027}.dark .answer,.dark .note{background:#2d4034}.dark .card p{color:#b5c4b7}.dark button:hover{background:#3b5143}.dark .cue{color:#c0d2bb}

</style></head><body><div class="layout"><aside><div class="logo serif"><span class="seal">记</span>申论拾记</div><div class="sub">READ · RECALL · WRITE</div><nav id="nav"></nav><div class="asidefoot">2027 备考资料整理<br>每日积累，落笔有据。<hr style="border:0;border-top:1px solid var(--line)">学习记录保存在当前浏览器<br><button class="small" onclick="backup()">导出进度</button> <button class="small" onclick="document.getElementById('import').click()">导入</button><input id="import" type="file" accept="application/json" hidden onchange="restore(this)"></div></aside><main><header class="top"><span><strong>个人学习书房</strong> / 申论素材与表达</span><span>四份资料 · 586 页 <button class="small" onclick="toggleDark()" aria-label="切换阅读配色">◐ 阅读配色</button></span></header><div id="app"></div></main></div><dialog id="dialog"><div class="modalhead"><span>阅读与溯源</span><button class="small" onclick="document.getElementById('dialog').close()">关闭 ×</button></div><div class="modalbody" id="modal"></div></dialog><script src="data.js"></script><script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let state={records:{},favorites:[],drafts:{}};try{const saved=JSON.parse(localStorage.getItem('shenlun-v1'));if(saved&&saved.records&&Array.isArray(saved.favorites))state={...state,...saved}}catch(e){}let view='home',topic='',kind='',query='',page=1,session=[],current=0,revealed=false;const core=LIB.cards.filter(c=>c.kind==='核心卡');const navs=[['home','01','学习首页'],['library','02','素材书架'],['review','03','记忆练习'],['essays','04','范文拆解'],['tests','05','套题实战'],['favorites','06','我的收藏'],['sources','07','原文与框架']];function save(){try{localStorage.setItem('shenlun-v1',JSON.stringify(state))}catch(e){toast('浏览器未能保存，请导出进度备份')}}function toast(t){const n=document.createElement('div');n.className='toast';n.textContent=t;document.body.append(n);setTimeout(()=>n.remove(),2400)}function toggleDark(){document.body.classList.toggle('dark')}function go(v,t=''){view=v;topic=t;query='';kind='';page=1;render();window.scrollTo(0,0)}function source(c){return `${LIB.sources[c.source].name} · PDF 第 ${c.page}${c.end>c.page?'–'+c.end:''} 页`}function fav(id){state.favorites.includes(id)?state.favorites=state.favorites.filter(x=>x!==id):state.favorites.push(id);save();render();if($('#dialog').open&&id.startsWith('c'))openCard(id)}function isFav(id){return state.favorites.includes(id)}function cardsHTML(list){return list.map(c=>`<article class="card"><div class="meta"><span class="tag">${esc(c.theme)}</span><span>${esc(c.kind)}${state.records[c.id]?' · 已练习':''}</span></div><h3>${esc(c.title)}</h3><p>${esc(c.cue||c.body.slice(0,90))}${c.cue?'':'…'}</p><div class="actions"><button class="small" onclick="openCard('${c.id}')">展开阅读 ↗</button><button class="small" onclick="fav('${c.id}')" aria-label="收藏${esc(c.title)}">${isFav(c.id)?'★ 已收藏':'☆ 收藏'}</button></div><div class="source">${esc(source(c))}</div></article>`).join('')}function render(){ $('#nav').innerHTML=navs.map(([v,n,t])=>`<button class="${v===view?'active':''}" onclick="go('${v}')"><span>${n}</span>${t}</button>`).join('');if(view==='home')home();else if(['library','favorites'].includes(view))library();else if(view==='review')reviewLanding();else if(view==='essays'||view==='tests')longList();else sourcesView()}
function home(){const due=LIB.cards.filter(c=>state.records[c.id]?.due<=Date.now()).length;$('#app').innerHTML=`<section class="hero"><div><div class="eyebrow">2027 · 申论积累计划</div><h1>读有所获，<br>记有所用。</h1><p>把厚厚的资料，变成脑中的论点。<br>从主题阅读出发，用主动回忆巩固，最后回到题目中表达。</p><div class="actions"><button class="primary" onclick="startReview('core')">开始今日背诵 →</button><button onclick="go('library')">浏览素材书架</button></div></div><div class="hero-note"><small>今日学习建议 / 15 MIN</small><strong>读 5 分钟<br>忆 5 分钟<br>写 5 分钟</strong><small>先读懂逻辑，再记关键词，<br>最后用自己的话写出来。</small></div></section><div class="stats"><div class="stat"><b>${LIB.cards.length}</b><span>去重后素材卡 · 含 ${core.length} 张核心卡</span></div><div class="stat"><b>35</b><span>范文 · 按立意与表达阅读</span></div><div class="stat"><b>${Object.keys(state.records).length}</b><span>已练习卡片</span></div><div class="stat"><b>${due}</b><span>到期复习卡片</span></div></div><div class="heading"><h2>循着主题，建立素材地图</h2><small>行政执法优先 · 九个主题</small></div><div class="themes">${LIB.themes.map((t,i)=>`<button class="theme" onclick="go('library','${t}')"><span class="num">0${i+1}</span><span><strong>${t}</strong><small>${LIB.cards.filter(c=>c.theme===t).length} 张素材卡 →</small></span></button>`).join('')}</div><div class="heading"><h2>先背逻辑，再背表达</h2><button class="small" onclick="go('library');kind='核心卡';library()">全部核心卡 →</button></div><div class="grid">${cardsHTML(core.slice(0,3))}</div><p class="hint">原文条目按关键词初步归类，可跨主题检索。核心卡的记忆线索与运用提示为整理内容，其余为资料摘录；未对全部引语和案例逐项作外部核验。</p>`}
function filtered(){return LIB.cards.filter(c=>(view!=='favorites'||isFav(c.id))&&(!topic||c.theme===topic)&&(!kind||c.kind===kind)&&(!query||[c.title,c.body,c.cue,c.use].join(' ').includes(query)))}function library(){const list=filtered(),max=Math.max(1,Math.ceil(list.length/18));page=Math.min(page,max);$('#app').innerHTML=`<div class="heading"><h2>${view==='favorites'?'我的收藏':'素材书架'}</h2><small>${list.length} 张匹配素材</small></div><p class="sectionintro">按主题理解，按用途积累。点开卡片查看全文、记忆线索与原始出处。</p><div class="toolbar"><input id="search" placeholder="搜索论点、案例、关键词…" value="${esc(query)}" aria-label="搜索素材"><select id="topic" aria-label="筛选主题"><option value="">全部主题</option>${LIB.themes.map(t=>`<option ${topic===t?'selected':''}>${t}</option>`).join('')}</select><select id="kind" aria-label="筛选写作用途"><option value="">全部用途</option>${[...new Set(LIB.cards.map(c=>c.kind))].map(k=>`<option ${kind===k?'selected':''}>${k}</option>`).join('')}</select><button onclick="startReview('filtered')">背诵当前结果</button></div><div class="grid" id="results">${cardsHTML(list.slice((page-1)*18,page*18))}</div>${list.length?'':'<p class="empty">暂无匹配素材。试试其他关键词，或先收藏几张卡片。</p>'}<div class="pagination"><button ${page===1?'disabled':''} onclick="page--;library()">上一页</button><span>${page} / ${max}</span><button ${page===max?'disabled':''} onclick="page++;library()">下一页</button></div>`;$('#search').oninput=e=>{query=e.target.value;page=1;const pos=e.target.selectionStart;library();$('#search').focus();$('#search').setSelectionRange(pos,pos)};$('#topic').onchange=e=>{topic=e.target.value;page=1;library()};$('#kind').onchange=e=>{kind=e.target.value;page=1;library()}}
function openModal(html){$('#modal').innerHTML=html;if(!$('#dialog').open)$('#dialog').showModal();$('#dialog').scrollTop=0}function openCard(id){const c=LIB.cards.find(c=>c.id===id);openModal(`<span class="tag">${esc(c.theme)} / ${esc(c.kind)}</span><h2>${esc(c.title)}</h2>${c.cue?`<div class="note"><b>记忆线索 · 整理</b><p class="cue">${esc(c.cue)}</p></div>`:''}<p class="muted">资料原文摘录</p><div class="reading">${esc(c.body)}</div>${c.use?`<div class="note"><b>写作运用 · 整理提示</b><p>${esc(c.use)}</p></div>`:''}<div class="source">${esc(source(c))}</div><div class="actions"><button onclick="openSource(${c.source},${c.page})">查看原文所在页</button><button onclick="fav('${c.id}')">${isFav(c.id)?'★ 已收藏':'☆ 加入收藏'}</button><button class="primary" onclick="$('#dialog').close();session=['${c.id}'];current=0;view='review';render();practice()">背这张卡片</button></div>`)}
function reviewLanding(){const due=LIB.cards.filter(c=>state.records[c.id]?.due<=Date.now()).length;$('#app').innerHTML=`<div class="heading"><h2>记忆练习</h2><small>读懂 → 遮挡 → 复述 → 对照</small></div><div class="reader"><div class="eyebrow">主动回忆 · 把知识留在脑中</div><h2>先想起来，再看答案。</h2><p>每天先复习到期内容，再学少量新卡。请选择自己的真实掌握程度。</p><div class="actions"><button class="primary" onclick="startReview('core')">核心卡练习（最多 10 张）</button><button onclick="startReview('due')">到期复习 · ${due}</button><button onclick="startReview('favorites')">收藏专项</button></div><div class="note">复习间隔：没记住 → 10 分钟；有印象 → 1 天；记住了 → 依次 3、7、14、30 天。此安排是学习辅助，不代表客观测评。<br>记录仅存于当前浏览器，可导出备份；不会发送提醒。</div></div>`}
function startReview(mode){let list=mode==='filtered'?filtered():mode==='due'?LIB.cards.filter(c=>state.records[c.id]?.due<=Date.now()):mode==='favorites'?LIB.cards.filter(c=>isFav(c.id)):core;list=[...list].sort((a,b)=>(state.records[a.id]?.due||0)-(state.records[b.id]?.due||0));if(!list.length){toast('当前没有可练习的卡片');return}session=list.slice(0,10).map(c=>c.id);current=0;view='review';render();practice()}
function practice(){revealed=false;if(current>=session.length){$('#app').innerHTML=`<div class="reader"><span class="eyebrow">这一轮，完成了</span><h2>积累一步，落笔更稳。</h2><p>本轮已完成 ${session.length} 张卡片，复习时间已保存。</p><div class="actions"><button class="primary" onclick="go('review')">返回记忆练习</button><button onclick="go('tests')">去套题中运用 →</button></div></div>`;return}const c=LIB.cards.find(x=>x.id===session[current]);$('#app').innerHTML=`<div class="heading"><h2>主动回忆</h2><small>第 ${current+1} / ${session.length} 张</small></div><div class="progress"><i style="width:${current/session.length*100}%"></i></div><div class="reader"><span class="tag">${esc(c.theme)} · ${esc(c.kind)}</span><h2>${esc(c.title)}</h2><p class="cue">${esc(c.cue||'用自己的话复述这条素材，并想一想能用在哪类题目中。')}</p><textarea id="draft" aria-label="默写或复述" placeholder="先回忆，再写下关键词或完整表达…">${esc(state.drafts[c.id]||'')}</textarea><div id="answer"><div class="hiddenanswer">答案已遮挡 · 先给自己一点回忆的时间</div><button class="primary" onclick="reveal()">展开原文，核对记忆</button></div><div class="source">${esc(source(c))}</div><div class="actions"><button class="small" onclick="go('review')">退出练习</button></div></div>`;$('#draft').oninput=e=>{state.drafts[c.id]=e.target.value;save()}}
function reveal(){revealed=true;const c=LIB.cards.find(x=>x.id===session[current]);$('#answer').innerHTML=`<div class="answer reading">${esc(c.body)}</div>${c.use?`<p>${esc(c.use)}</p>`:''}<p class="muted">对照关键词与逻辑，自评本次掌握程度：</p><div class="actions"><button onclick="grade(0)">没记住 · 10 分钟后</button><button onclick="grade(1)">有印象 · 明天</button><button class="primary" onclick="grade(2)">记住了 · 延后复习</button></div>`}function grade(n){if(!revealed)return;const id=session[current],old=state.records[id]||{},level=n===2?Math.min((old.level||0)+1,4):0,days=n===0?10/1440:n===1?1:[0,3,7,14,30][level];state.records[id]={level,due:Date.now()+days*864e5,last:Date.now(),count:(old.count||0)+1};save();current++;practice()}
function longList(){const arr=view==='essays'?LIB.essays:LIB.tests;$('#app').innerHTML=`<div class="heading"><h2>${view==='essays'?'范文拆解':'套题实战'}</h2><small>${arr.length} ${view==='essays'?'篇范文':'套试题'}</small></div><p class="sectionintro">${view==='essays'?'先看题旨，再抓分论点，最后读完整论证。结构提示摘取原文段首，适合遮挡后复述。':'按资料中的套次阅读材料、题目与解析。建议先独立作答，再向后阅读解析；这里不将资料答案标为官方答案。'}</p>${arr.map((e,i)=>`<div class="listrow"><div><span class="tag">${view==='essays'?e.theme:'套题 '+(i+1)}</span><h3>${esc(e.title)}</h3><small class="muted">PDF 第 ${e.page}–${e.end} 页</small></div><button onclick="openLong('${e.id}')">阅读 →</button></div>`).join('')}`}
function openLong(id){const e=[...LIB.essays,...LIB.tests].find(x=>x.id===id);openModal(`<span class="tag">${e.theme||'套题实战'}</span><h2>${esc(e.title)}</h2>${e.outline?.length?`<details class="note"><summary>展开结构提示 · 原文段首摘取</summary><ol>${e.outline.map(l=>`<li>${esc(l)}</li>`).join('')}</ol><p>练习：合上提示，用三个关键词复述论证路径。</p></details>`:''}<details><summary>展开全文阅读（资料原文）</summary><div class="reading" style="margin-top:20px">${esc(e.body)}</div></details><div class="source">${esc(source(e))}</div><div class="actions"><button onclick="openSource(${e.source},${e.page})">查看原文页</button></div>`)}
function sourcesView(){$('#app').innerHTML=`<div class="heading"><h2>整理框架与原文</h2><small>来源可追溯 · 页码为 PDF 实际页序</small></div><div class="reader"><h2>主题 × 用途 × 记忆 × 运用</h2><p><b>① 主题：</b>以九个主题建立知识目录，行政执法优先。</p><p><b>② 用途：</b>核心卡、意义影响、开头、结尾、名言摘录与表达素材。原文编号条目经清理换行、按全文去重，主题按关键词初步归类。</p><p><b>③ 记忆：</b>核心卡提供关键词与运用提示；其余卡片保留资料表达，使用遮挡回忆与默写对照。</p><p><b>④ 运用：</b>35 篇范文读结构，15 套试题练迁移。套题年份和名称沿用资料标注。</p><div class="note">推荐顺序：先学核心卡 → 每个主题选 1 个开头、1 个结尾与少量表达 → 读同主题范文 → 做题后补充素材。<br>“万能”表达须结合题目材料改写，不能代替具体分析。资料中的名言、案例与政策表述未逐条外部核实；引语异文和明显文字问题请回看原页。文化“双创”应区分创造性转化、创新性发展与创新创业。</div></div>${LIB.sources.map((s,i)=>`<div class="listrow"><div><h3>${esc(s.name)}</h3><small class="muted">${s.pages.length} 页 · 全文按页检索与阅读</small></div><button onclick="openSource(${i},1)">打开原文 →</button></div>`).join('')}<div class="actions"><button onclick="backup()">导出学习记录</button><button onclick="$('#import').click()">导入学习记录</button></div>`}
function openSource(s,p){const d=LIB.sources[s];p=Math.max(1,Math.min(Number(p)||1,d.pages.length));openModal(`<h3>${esc(d.name)}</h3><div class="toolbar"><button ${p===1?'disabled':''} onclick="openSource(${s},${p-1})">上一页</button><label>页码 <input id="pagenum" type="number" min="1" max="${d.pages.length}" value="${p}" style="width:85px;min-width:0"></label><button onclick="openSource(${s},$('#pagenum').value)">跳转</button><button ${p===d.pages.length?'disabled':''} onclick="openSource(${s},${p+1})">下一页</button><span>共 ${d.pages.length} 页</span></div><div class="toolbar"><input id="sourceSearch" placeholder="在本资料全文中搜索" aria-label="搜索资料全文"><button onclick="findSource(${s})">查找</button></div><div id="sourceMatches"></div><div class="reading">${esc(d.pages[p-1]||'本页无可提取文字（空白页或图片页）。')}</div><div class="source">PDF 实际第 ${p} 页 · 文字提取版，图表与原始排版请参阅原 PDF。</div>`)}function findSource(s){const q=$('#sourceSearch').value.trim();if(!q)return;const matches=LIB.sources[s].pages.map((p,i)=>p.includes(q)?i+1:null).filter(Boolean);$('#sourceMatches').innerHTML=`<p>找到 ${matches.length} 页</p><div class="actions">${matches.map(p=>`<button class="small" onclick="openSource(${s},${p})">第 ${p} 页</button>`).join('')}</div>`}
function backup(){const b=new Blob([JSON.stringify({version:1,...state},null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='申论拾记-学习进度.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}async function restore(input){try{const v=JSON.parse(await input.files[0].text());if(v.version!==1||!v.records||typeof v.records!=='object'||!Array.isArray(v.favorites)||!v.drafts)throw Error();const valid=new Set(LIB.cards.map(c=>c.id));for(const [id,r] of Object.entries(v.records)){if(valid.has(id)&&r&&Number.isFinite(r.due)&&Number.isFinite(r.level)&&r.level>=0&&r.level<=4)state.records[id]=r}state.favorites=[...new Set([...state.favorites,...v.favorites.filter(id=>valid.has(id))])];for(const [id,t] of Object.entries(v.drafts))if(valid.has(id)&&typeof t==='string')state.drafts[id]=t;save();render();toast('进度已合并导入')}catch(e){toast('文件格式不正确，请选择本网站导出的进度文件')}input.value=''}render();
</script></body></html>
